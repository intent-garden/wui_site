name: Deploy website to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Include documentation updates from the public WUI repository.
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout documentation sources
        uses: actions/checkout@v4
        with:
          repository: intent-garden/wui
          ref: main
          path: _wui_source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: _wui_source/doc/requirements.txt
      - name: Install documentation builder
        run: python -m pip install -r _wui_source/doc/requirements.txt
      - name: Prepare website and build both documentation languages
        run: |
          python tools/prepare_site.py site
          python _wui_source/doc/build.py --output site
          printf 'libwui.org\n' > site/CNAME
          touch site/.nojekyll
          git -C _wui_source rev-parse HEAD > site/wui-documentation-revision.txt
      - name: Check publication contents
        run: |
          test -s site/main/index.html
          test -s site/main_ru/index.html
          test -s site/doc/index.html
          test -s site/doc_ru/index.html
          test -s site/doc/search/search_index.json
          test -s site/doc_ru/search/search_index.json
          test ! -e site/.git
          test ! -e site/_wui_source
          test ! -e site/tools
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: website-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
